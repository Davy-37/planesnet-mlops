name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  # Every pull request must be linked to an issue (Closes #N / Fixes #N / Resolves #N).
  issue-link:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check that the PR references an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::The PR description must contain a closing keyword, e.g. 'Closes #12'."
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit hooks (Black, Ruff, file checks)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  tests:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Type check
        run: mypy src api
      - name: Run tests with coverage
        run: pytest -q --cov --cov-report=term-missing

  smoke-train:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[training,dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      # short training run on a sample: checks that the pipeline runs, not the model score
      - run: dvc repro --dry
      - run: python scripts/train.py --smoke --limit 500 --epochs 1
