name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/planesnet-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - uses: actions/checkout@v4
      # kubeconfig k3s stocke en secret, jamais versionne
      - run: echo "${{ secrets.KUBECONFIG }}" > /tmp/kubeconfig
      - run: kubectl --kubeconfig /tmp/kubeconfig set image deployment/planesnet-api api=ghcr.io/${{ github.repository }}/planesnet-api:${{ github.sha }}
      - run: kubectl --kubeconfig /tmp/kubeconfig rollout status deployment/planesnet-api --timeout=120s
