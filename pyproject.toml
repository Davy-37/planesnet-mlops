[project]
name = "planesnet-mlops"
dynamic = ["version"]
description = "End-to-end MLOps pipeline on PlanesNet: scene-based split, DVC, MLflow, serving, drift monitoring"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
training = [
    "torch>=2.3,<3.0",
    "torchvision>=0.18",
    "scikit-learn>=1.5,<2.0",
    "mlflow>=2.13,<4.0",
    "dvc[s3]>=3.51,<4.0",
]
serving = [
    "torch>=2.3,<3.0",
    "torchvision>=0.18",
    "mlflow>=2.13,<4.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "prometheus-fastapi-instrumentator>=7.0",
]
monitoring = ["evidently>=0.4", "pandas>=2.2,<3.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "black>=25.1",
    "ruff>=0.9",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "build>=1.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# single source of truth for the version: src/planesnet/__init__.py
[tool.hatch.version]
path = "src/planesnet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/planesnet"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: imports, B: bugbear, UP: pyupgrade, D: docstrings
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["E501"]  # line length is handled by Black

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# test functions are documented by their name; module docstrings stay required
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["src/planesnet", "api"]

[tool.coverage.report]
show_missing = true
skip_empty = true
