apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planesnet-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [planesnet.example.com]
      secretName: planesnet-tls
  rules:
    - host: planesnet.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: planesnet-api
                port: { number: 80 }
